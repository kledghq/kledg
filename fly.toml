# Fly.io: Kledg from the Dockerfile. Guide: docs/self-hosting.md#flyio
# `fly launch --no-deploy` renames the app; set the database with
# `fly postgres attach` (Fly Postgres) or `fly secrets set DATABASE_URL=...`.

app = "kledg"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a temporary Machine with the app's secrets, before the new
  # version replaces the old one; a failed migration stops the deploy.
  release_command = "/app/docker-migrate.sh"

[env]
  PORT = "3000"
  # Set by Fly Proxy from the connection it accepted (not by the client).
  RATE_LIMIT_IP_HEADER = "Fly-Client-IP"
  # Machines have no persistent disk here: rely on the database's backups.
  KLEDG_BACKUP = "off"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
